      --bg-color: #0f172a;

      --primary-action: #38bdf8;
      --secondary-action: #94a3b8;
      --font-family: 'Outfit';

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body { 
      font-family: var(--font-family), 'Outfit', sans-serif; 
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .code-area { 
      font-family: 'JetBrains Mono', monospace; 
    }
    
    .btn-glow {
      position: relative;
      transition: all 0.3s ease;
    }
    
    .btn-glow:hover { 
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); 
      transform: translateY(-1px);
    }

    .btn-glow:active {
      transform: translateY(1px);
    }

    }
    
    .toast-in { 
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
    }
    
    @keyframes slideUp { 
      from { opacity: 0; transform: translate(-50%, 20px); } 
      to { opacity: 1; transform: translate(-50%, 0); } 
    }
    
    .fade-in { 
      animation: fadeIn 0.4s ease-out; 
    }
    
    @keyframes fadeIn { 
      from { opacity: 0; } 
      to { opacity: 1; } 
    }

    /* Custom Scrollbar for editor */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 4px;

<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Game Retro Canvas</title>
  <style>
    body { margin: 0; background: #111827; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: #fff; overflow: hidden; }
    canvas { background: #1f2937; border: 3px solid #4b5563; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { font-size: 1.2rem; margin-bottom: 10px; color: #10b981; }
    p { font-size: 0.8rem; color: #9ca3af; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>MINI BOX DODGER</h1>
  <canvas id="gameCanvas" width="400" height="250"></canvas>
  <p>Gunakan tombol PANAH Kiri / Kanan pada keyboard untuk menghindar!</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 180, y: 220, size: 20, speed: 5, color: "#10b981" };
    let obstacle = { x: Math.random() * 380, y: 0, size: 20, speed: 3.5, color: "#ef4444" };
    let score = 0;
    let keys = {};

    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw Player
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.size, player.size);
      
      // Draw Obstacle
      ctx.fillStyle = obstacle.color;
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.size, obstacle.size);
      
      // Draw Score
      ctx.fillStyle = "#fff";
      ctx.font = "16px monospace";
      ctx.fillText("SCORE: " + score, 15, 25);
    }

    function update() {
      if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
      if (keys["ArrowRight"] && player.x < canvas.width - player.size) player.x += player.speed;

      obstacle.y += obstacle.speed;
      if (obstacle.y > canvas.height) {
        obstacle.y = 0;
        obstacle.x = Math.random() * (canvas.width - obstacle.size);
        obstacle.speed += 0.2;
        score += 10;
      }

      // Collision Check
      if (player.x < obstacle.x + obstacle.size &&
          player.x + player.size > obstacle.x &&
          player.y < obstacle.y + obstacle.size &&
          player.y + player.size > obstacle.y) {
        score = 0;
        obstacle.y = 0;
        obstacle.speed = 3.5;
        obstacle.x = Math.random() * (canvas.width - obstacle.size);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  <\/script>
</body>
</html>`,

    });

    // Beautify HTML (Simple structural indentation)
    document.getElementById('btn-beautify').addEventListener('click', () => {
      let html = textarea.value.trim();
      if (!html) return;
      
      let formatted = '';
      let reg = /(>)(<)(\/*)/g;
      html = html.replace(reg, '$1\r\n$2$3');
      let pad = 0;
      
      html.split('\r\n').forEach((line) => {
        let indent = 0;
        if (line.match(/.+<\/\w[^>]*>$/)) {
          indent = 0;
        } else if (line.match(/^<\/\w/)) {
          if (pad !== 0) pad -= 2;
        } else if (line.match(/^<\w[^>]*[^\/]>.*$/)) {
          indent = 2;
        } else {
          indent = 0;
        }
        
        formatted += ' '.repeat(pad) + line + '\r\n';
        pad += indent;
      });
      
      textarea.value = formatted.trim();
      updateLinesAndChars();
      updatePreview();
      showToast('HTML berhasil dirapikan!', '#22c55e');
    });

    // Minify HTML
    document.getElementById('btn-minify').addEventListener('click', () => {
      let html = textarea.value;
      if (!html.trim()) return;
      
      // Remove comments and collapse spaces
      let minified = html
        .replace(/<!--[\s\S]*?-->/g, '')
        .replace(/\s+/g, ' ')
        .replace(/>\s+</g, '><')
        .trim();
        
      textarea.value = minified;
      updateLinesAndChars();
      updatePreview();
      showToast('HTML berhasil dikompresi (Minified)!', '#38bdf8');
    });

    // Extract Plain Text Only (Strips all HTML/CSS/JS tags)
    document.getElementById('btn-extract-text').addEventListener('click', () => {
      let html = textarea.value;
      if (!html.trim()) return;

      // Extract text content from markup safely using DOMParser
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      let extracted = doc.body.textContent || doc.documentElement.textContent || "";
      
      textarea.value = extracted.trim().replace(/\n\s*\n/g, '\n'); // remove empty lines
      updateLinesAndChars();
      updatePreview();
      showToast('Teks murni berhasil diekstrak!', '#10b981');
    });

    // Boilerplate drop-down loader
    boilerplateSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (boilerplates[val]) {
        textarea.value = boilerplates[val];
        updateLinesAndChars();
        updatePreview();
        showToast('Template berhasil disematkan!', '#22c55e');
      }
    });

    // Format Selection Action
    formatBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        formatBtns.forEach(b => {
          b.classList.remove('active', 'border-[#38bdf8]', 'bg-[#1e293b]');
          b.classList.add('border-[#334155]', 'bg-[#1e293b]/40');
          b.querySelector('span').classList.remove('text-[#38bdf8]');
          b.querySelector('span').classList.add('text-[#e2e8f0]');
        });
        
        btn.classList.add('active', 'border-[#38bdf8]', 'bg-[#1e293b]');
        btn.classList.remove('border-[#334155]', 'bg-[#1e293b]/40');
        
        const mainSpan = btn.querySelector('span');
        mainSpan.classList.remove('text-[#e2e8f0]');
        mainSpan.classList.add('text-[#38bdf8]');
        
        selectedFormat = btn.dataset.fmt;
        extLabel.textContent = '.' + selectedFormat;
      });
    });

    // Show Toast Notification
    function showToast(msg, color) {
      toast.innerHTML = msg;
      toast.style.backgroundColor = color || '#22c55e';
      toast.classList.remove('hidden');
      
      // Auto dismiss
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }

    // Converter Engine
    function convertContent(html, fmt) {
      if (fmt === 'html' || fmt === 'txt') {
        return html;
      }
      
      if (fmt === 'xml') {
        // Basic markup to XML parsing safely
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const serializer = new XMLSerializer();
        const xmlStr = serializer.serializeToString(doc);
        return '<?xml version="1.0" encoding="UTF-8"?>\n<root>\n' + xmlStr + '\n</root>';
      }
      
      if (fmt === 'json') {
        try {
          // Send back full detailed JSON breakdown of markup
          return JSON.stringify({
            status: "success",
            format: "HTML Workspace Export",
            timestamp: new Date().toISOString(),
            raw_html: html,
            details: {
              characters: html.length,
              lines: html.split('\n').length
            }
          }, null, 2);
        } catch (e) {
          return JSON.stringify({ html: html }, null, 2);
        }
      }

      if (fmt === 'md') {
        // Quick & light HTML to Markdown converter
        let md = html
          .replace(/<h1[^>]*>([\s\S]*?)<\/h1>/gi, '# $1\n\n')
          .replace(/<h2[^>]*>([\s\S]*?)<\/h2>/gi, '## $1\n\n')
          .replace(/<h3[^>]*>([\s\S]*?)<\/h3>/gi, '### $1\n\n')
          .replace(/<strong[^>]*>([\s\S]*?)<\/strong>/gi, '**$1**')
          .replace(/<b[^>]*>([\s\S]*?)<\/b>/gi, '**$1**')
          .replace(/<em[^>]*>([\s\S]*?)<\/em>/gi, '*$1*')
          .replace(/<i[^>]*>([\s\S]*?)<\/i>/gi, '*$1*')
          .replace(/<p[^>]*>([\s\S]*?)<\/p>/gi, '$1\n\n')
          .replace(/<br\s*\/?>/gi, '\n')
          .replace(/<a[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi, '[$2]($1)')
          .replace(/<ul[^>]*>([\s\S]*?)<\/ul>/gi, '$1\n')
          .replace(/<li[^>]*>([\s\S]*?)<\/li>/gi, '* $1\n')
          .replace(/<[^>]*>/g, ''); // strip remaining tags
          
        return md.trim();
      }
      
      return html;
    }

    // Get MIME Types matching target outputs
    function getMime(fmt) {
      const m = { 
        html: 'text/html', 
        txt: 'text/plain', 
        xml: 'application/xml', 
        json: 'application/json',
        md: 'text/markdown'
      };
      return m[fmt] || 'text/plain';
    }

    // Download File Action
    document.getElementById('btn-download').addEventListener('click', () => {
      const html = textarea.value.trim();
      if (!html) { 
        showToast('<i data-lucide="alert-circle" class="w-4 h-4 inline"></i> Silakan masukkan kode HTML terlebih dahulu!', '#f87171'); 
        lucide.createIcons();
        return; 
      }
      
      const rawName = filenameInput.value.trim() || 'workspace-dokumen';
      const name = rawName + '.' + selectedFormat;
      const content = convertContent(html, selectedFormat);
      
      // Blob and trigger download anchor flow
      const blob = new Blob([content], { type: getMime(selectedFormat) + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      link.style.display = 'none';
      
      document.body.appendChild(link);
      link.click();
      
      setTimeout(() => {
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 100);
      
      showToast(`<i data-lucide="check-circle" class="w-4 h-4 inline"></i> File <b>${name}</b> tersimpan di Downloads!`, '#22c55e');
      lucide.createIcons();
    });

    // Element SDK Configurations
    const defaultConfig = {
      app_title: 'HTML Workspace & Converter Pro',
      background_color: '#0f172a',
      surface_color: '#1e293b',
      text_color: '#e2e8f0',
      primary_action: '#38bdf8',
      secondary_action: '#94a3b8',
      font_family: 'Outfit',
      font_size: 16
    };

    function applyConfig(c) {
      const root = document.documentElement;
      if (c.background_color) root.style.setProperty('--bg-color', c.background_color);
      if (c.surface_color) root.style.setProperty('--surface-color', c.surface_color);
      if (c.text_color) root.style.setProperty('--text-color', c.text_color);
      if (c.primary_action) root.style.setProperty('--primary-action', c.primary_action);
      if (c.secondary_action) root.style.setProperty('--secondary-action', c.secondary_action);
      if (c.font_family) root.style.setProperty('--font-family', c.font_family);
      
      const title = document.getElementById('title');
      if (title) {
        title.textContent = c.app_title || defaultConfig.app_title;
        const base = c.font_size || defaultConfig.font_size;
        title.style.fontSize = (base * 1.9) + 'px';
      }
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (c) => applyConfig(c),
        mapToCapabilities: (c) => ({
          recolorables: [
            { get: () => c.background_color || defaultConfig.background_color, set: v => { c.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
            { get: () => c.surface_color || defaultConfig.surface_color, set: v => { c.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
            { get: () => c.text_color || defaultConfig.text_color, set: v => { c.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
            { get: () => c.primary_action || defaultConfig.primary_action, set: v => { c.primary_action = v; window.elementSdk.setConfig({ primary_action: v }); } },
            { get: () => c.secondary_action || defaultConfig.secondary_action, set: v => { c.secondary_action = v; window.elementSdk.setConfig({ secondary_action: v }); } }
          ],
          borderables: [],
          fontEditable: { get: () => c.font_family || defaultConfig.font_family, set: v => { c.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
          fontSizeable: { get: () => c.font_size || defaultConfig.font_size, set: v => { c.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
        }),
        mapToEditPanelValues: (c) => new Map([
          ['app_title', c.app_title || defaultConfig.app_title]
        ])
      });
    } else {
      console.warn("Element SDK tidak terdeteksi. Berjalan dalam mode mandiri.");
      applyConfig(defaultConfig);
    }

    lucide.createIcons();
  </script>
</body>
</html>
